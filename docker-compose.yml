services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: udev-api
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:8010:8000"
    volumes:
      - ./:/var/www
      - udev_vendor:/var/www/vendor
    env_file:
      - .env
    environment:
      APP_NAME: UDev
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      SESSION_SECURE_COOKIE: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]

  frontend:
    build:
      context: ../udev-frontend
      dockerfile: Dockerfile
    container_name: udev-frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:5173:5173"
    volumes:
      - ../udev-frontend:/app
      - udev_frontend_node_modules:/app/node_modules
    env_file:
      - ../udev-frontend/.env
    depends_on:
      - app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  db:
    image: mysql:8.4
    container_name: udev-db
    restart: unless-stopped
    ports:
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - udev_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  udev_mysql:
  udev_vendor:
  udev_frontend_node_modules:
